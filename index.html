<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pollen Fairy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="game"></canvas>

  <button id="mute" class="round" data-i18n-aria="a.sound" aria-label="Sound on or off">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="spk" d="M4 9h3l5-4v14l-5-4H4z"/>
      <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/>
      <path class="x" d="M16 9l5 6M21 9l-5 6"/>
    </svg>
  </button>

  <div id="title" class="overlay show">
    <h1><span data-i18n="title.a">Pollen</span><span class="b" data-i18n="title.b">Fairy</span></h1>
    <p class="tag" data-i18n="tag">Wake up the sleepy flowers!</p>
    <button id="play" class="big" data-i18n-aria="a.play" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>
    <div class="keys">
      <span><kbd>◀</kbd><kbd>▶</kbd> <span data-i18n="keys.walk">walk</span></span>
      <span><kbd class="wide" data-i18n="keys.space">Space</kbd> <span data-i18n="keys.fly">hold to fly</span></span>
    </div>
  </div>

  <div id="langs" class="langs" role="group" data-i18n-aria="a.lang" aria-label="Language">
    <button data-lang="en" aria-label="English">
      <svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukc"><path d="M0 0v30h60V0z"/></clipPath><g clip-path="url(#ukc)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg>
    </button>
    <button data-lang="pl" aria-label="Polski">
      <svg viewBox="0 0 16 10" aria-hidden="true"><path d="M0 0h16v5H0z" fill="#fff"/><path d="M0 5h16v5H0z" fill="#dc143c"/></svg>
    </button>
  </div>

  <button id="home" class="round home" data-i18n-aria="a.pause" aria-label="Pause">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
  </button>

  <div id="who" class="overlay">
    <h2 class="screen-title" data-i18n="who">Who is playing?</h2>
    <div id="profiles" class="profiles"></div>
  </div>

  <div id="newkid" class="overlay">
    <div class="card">
      <h2 class="ask" data-i18n="ask.name">What is the fairy's name?</h2>
      <input id="nameInput" class="name-input" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" data-i18n-aria="a.yourName" aria-label="Fairy name">
      <div class="row">
        <button id="nameBack" class="pill ghost" data-i18n-aria="a.back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <button id="nameOk" class="big small" data-i18n-aria="a.ok" aria-label="OK">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.2 5.3 12l-1.8 1.8 6 6L21 8.3l-1.8-1.8z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="wardrobe" class="overlay">
    <div class="ward">
      <div class="ward-preview">
        <canvas id="wardCanvas"></canvas>
        <span id="wardName" class="nametag"></span>
      </div>
      <div class="ward-closet">
        <div id="wardTabs" class="ward-tabs"></div>
        <div id="wardStyles" class="ward-styles"></div>
        <div id="wardColors" class="ward-swatches"></div>
        <div id="wardSkins" class="ward-swatches"></div>
      </div>
    </div>
    <div class="row">
      <button id="wardRandom" class="pill" data-i18n-aria="a.random" aria-label="Surprise me">🎲</button>
      <button id="wardDone" class="big small" data-i18n-aria="a.done" aria-label="Done">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.2 5.3 12l-1.8 1.8 6 6L21 8.3l-1.8-1.8z"/></svg>
      </button>
    </div>
  </div>

  <div id="confirm" class="overlay">
    <div class="card">
      <p id="confirmMsg" class="ask"></p>
      <div class="row">
        <button id="confirmNo" class="pill" data-i18n="no">No</button>
        <button id="confirmYes" class="pill danger" data-i18n="yes">Yes</button>
      </div>
    </div>
  </div>

  <div id="map" class="overlay">
    <div class="map-top">
      <button id="mapBack" class="pill ghost" data-i18n-aria="a.changePlayer" aria-label="Change player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <button id="mapDress" class="pill dress-btn" data-i18n-aria="a.dress" aria-label="Dress up">👗</button>
    </div>
    <div class="map-board">
      <svg id="mapSvg" class="map-path" viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true">
        <path id="mapPath" d=""/>
      </svg>
      <div id="stones"></div>
      <div id="mapMarker" class="marker"><span id="mapName" class="nametag"></span><canvas id="mapFairy" class="fairy"></canvas></div>
    </div>
  </div>

  <div id="pause" class="overlay">
    <div class="card">
      <h2 data-i18n="paused">Paused</h2>
      <div class="row">
        <button id="pauseMap" class="pill" data-i18n-aria="a.map" aria-label="Map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 3 11h2.5v8.5h5v-5h3v5h5V11H21z"/></svg>
        </button>
        <button id="pauseReplay" class="pill" data-i18n-aria="a.restart" aria-label="Start again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <button id="pausePlay" class="big small" data-i18n-aria="a.resume" aria-label="Keep playing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="end" class="overlay">
    <div class="card">
      <h2 id="endTitle">Hooray!</h2>
      <p id="endSub" class="sub"></p>
      <div id="endStars" class="end-stars"></div>
      <div class="count">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <g fill="#ff8fc7"><circle cx="20" cy="9" r="7"/><circle cx="30.5" cy="16.6" r="7"/><circle cx="26.5" cy="29" r="7"/><circle cx="13.5" cy="29" r="7"/><circle cx="9.5" cy="16.6" r="7"/></g>
          <circle cx="20" cy="20" r="6.5" fill="#ffd34d"/>
        </svg>
        <span id="endCount">0 / 0</span>
      </div>
      <div class="row">
        <button id="endMap" class="pill" data-i18n-aria="a.map" aria-label="Map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 3 11h2.5v8.5h5v-5h3v5h5V11H21z"/></svg>
        </button>
        <button id="endReplay" class="pill" data-i18n-aria="a.replay" aria-label="Play again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <button id="endNext" class="big small" data-i18n-aria="a.next" aria-label="Next level">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="touch">
    <button data-k="left" class="tbtn" id="tl" data-i18n-aria="a.left" aria-label="Walk left"><svg viewBox="0 0 24 24"><path d="M15 5L7 12l8 7z"/></svg></button>
    <button data-k="right" class="tbtn" id="tr" data-i18n-aria="a.right" aria-label="Walk right"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7z"/></svg></button>
    <button data-k="fly" class="tbtn" id="tf" data-i18n-aria="a.fly" aria-label="Fly">
      <svg viewBox="0 0 40 40"><g fill="#ff8fc7"><ellipse cx="12" cy="15" rx="9" ry="7" transform="rotate(-30 12 15)"/><ellipse cx="28" cy="15" rx="9" ry="7" transform="rotate(30 28 15)"/><ellipse cx="14" cy="27" rx="6" ry="4.5" transform="rotate(30 14 27)"/><ellipse cx="26" cy="27" rx="6" ry="4.5" transform="rotate(-30 26 27)"/></g><rect x="19" y="10" width="2.4" height="22" rx="1.2" fill="#6a4bb0"/></svg>
    </button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
